name: Feature request
description: Suggest an idea for this project!
type: Feature
labels: ["enhancement", "feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! Please fill out the sections below.
        
        If you aren't ready to open an issue quite yet, you may also open a new discussion or talk about it on the Discord.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Add any other context about the feature request here.

        You can drag and drop screenshots into this box or paste them from your clipboard.
