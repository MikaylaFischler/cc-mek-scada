iname: Bug report
description: Create a report to help improve the project.
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: describe-bug
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Please paste a text snippet from the `log.txt` file if possible. This will be formatted as code automatically.
        
        Alternatively, you may upload entire log files to pastebin with `pastebin put log.txt` on the computer experiencing the bug, then share the pastebin code/link.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If you can't include log text, or if it would help explain the problem, drag and drop screenshots here.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
