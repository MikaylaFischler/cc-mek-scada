# Deploy minified application, installation manifests, and shields versions
name: Deploy Software System

on:
  workflow_dispatch:
  push:
    branches:
      # - main
      # - devel
      - deploy-test

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10' 
      # Setup
      - name: Create deployment directories
        if: success() || failure()
        shell: bash
        run: mkdir -p deploy/{builds,manifests}/{main,devel,deploy-test}
      # Generate manifest + shields files for main branch
      - name: Checkout main
        id: checkout-main
        uses: actions/checkout@v7.0.0
        with:
          ref: 'main'
          clean: false
      - name: (LEGACY) Generate manifest and shields for `main` branch
        id: manifest-main
        if: ${{ (success() || failure()) && steps.checkout-main.outcome == 'success' }}
        run: python build/gen_manifest.py --shields
      - name: Save main's manifest
        if: ${{ (success() || failure()) && steps.manifest-main.outcome == 'success' }}
        run: mv install_manifest.json deploy/manifests/main
      # Generate manifest for devel branch
      - name: Checkout devel
        id: checkout-devel
        if: success() || failure()
        uses: actions/checkout@v7.0.0
        with:
          ref: 'devel'
          clean: false
      - name: (LEGACY) Generate installation manifest for `devel` branch
        id: manifest-devel
        if: ${{ (success() || failure()) && steps.checkout-devel.outcome == 'success' }}
        run: python build/gen_manifest.py
      - name: Save devel's manifest
        if: ${{ (success() || failure()) && steps.manifest-devel.outcome == 'success' }}
        run: mv install_manifest.json deploy/manifests/devel
      # Generate manifest and build for deploy-test branch
      - name: Checkout deploy-test
        id: checkout-test
        if: success() || failure()
        uses: actions/checkout@v7.0.0
        with:
          ref: 'deploy-test'
          clean: false
      - name: Minify deploy-test
        id: minify-test
        if: ${{ (success() || failure()) && steps.checkout-test.outcome == 'success' }}
        run: python build/gen_minified.py deploy/builds/deploy-test --deployment
      - name: Generate manifest for deploy-test
        id: manifest-test
        if: ${{ (success() || failure()) && steps.checkout-test.outcome == 'success' }}
        run: python build/gen_manifest.py deploy/builds/deploy-test
      # All artifacts ready now, upload deploy directory
      - name: Upload artifacts
        id: upload-artifacts
        if: ${{ (success() || failure()) && (steps.manifest-main.outcome == 'success' || steps.manifest-devel.outcome == 'success') }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Upload manifest JSON
          path: 'deploy/'
      - name: Deploy to GitHub Pages
        if: ${{ (success() || failure()) && steps.upload-artifacts.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v3.0.2-node.24
